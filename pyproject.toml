[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tier1-isp-np-hard-kernel"
version = "0.1.0"
description = "Algorithmic Solvers for Tier-1 ISP Apex NP-Hard Problems, Optical Spectrum Allocation, and Transit Unit Economics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "DeepMind & Antigravity Advanced Agentic Systems" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.scripts]
isp-np-kernel = "tier1_isp_np_hard_kernel.cli:main"
